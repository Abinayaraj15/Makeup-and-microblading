<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="alternate icon" href="assets/icons/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | VELOURA Client Lounge & Studio Portal</title>
  <meta name="description" content="Securely access your private appointment records, clinical pigment charts, and customized aftercare checklist.">
  
  <link rel="stylesheet" id="bootstrap-css" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header-footer.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/rtl.css">
</head>
<body class="bg-subtle pmu-portal-auth-page" style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Simple Sticky Header -->
  <header class="py-3 bg-surface border-bottom sticky-top pmu-header-simple">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="pmu-brand" href="index.html">
        <div class="pmu-brand-logo"><img src="assets/icons/logo.svg" alt="VELOURA Logo" width="40" height="40"></div>
        <div class="pmu-brand-text">
          <span class="pmu-brand-name">VELOURA</span>
          <span class="pmu-brand-tagline">PERMANENT MAKEUP &amp; BROW STUDIO</span>
        </div>
      </a>
      <div class="d-flex align-items-center gap-3">
        <button class="icon-control-btn" data-action="toggle-language" title="Toggle RTL/LTR (English / العربية)" aria-label="Toggle RTL/LTR">
          <i class="fa-solid fa-right-left rtl-toggle-icon"></i>
          <span class="lang-label visually-hidden">EN (LTR)</span>
        </button>
        <button class="icon-control-btn" data-action="toggle-theme" title="Toggle Theme">
          <i class="fa-solid fa-moon theme-toggle-icon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Login Form Main Container -->
  <main class="container my-auto py-4 py-md-5" style="max-width: 480px;">
    <div class="pmu-card p-4 p-md-5">
      <!-- 1. Header -->
      <div class="text-center mb-4">
        <span class="pmu-badge pmu-badge-gold mb-2">Private Lounge Portal</span>
        <h3 class="font-serif fw-bold mb-1">Welcome Back</h3>
        <p class="text-muted small mb-0">Sign in to manage appointments, treatment logs &amp; aftercare</p>
      </div>

      <!-- 4-8. Form -->
      <form id="login-form" novalidate>
        <!-- 4. Email Address -->
        <div class="mb-3">
          <label class="form-label" for="login-email">Email Address *</label>
          <div class="input-icon-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required autocomplete="email">
          </div>
        </div>

        <!-- 5. Password -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label mb-0" for="login-password">Password *</label>
            <a href="forgot-password.html" class="small text-gold text-decoration-none">Forgot Password?</a>
          </div>
          <div class="input-icon-group position-relative">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-password" class="form-control pe-5" placeholder="••••••••" minlength="6" required autocomplete="current-password">
            <button type="button" class="btn-toggle-password" id="btn-toggle-password" aria-label="Toggle password visibility" title="Show password">
              <i class="fa-regular fa-eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>

        <!-- 6. Remember Me -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small" for="rememberMe">Remember this browser for 30 days</label>
        </div>

        <!-- 7. Primary Action -->
        <button type="submit" class="btn-pmu-gold w-100 mb-3">
          <span>Sign In to Lounge</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <!-- 8. Social Sign-In -->
        <div class="auth-divider">
          <span>OR CONTINUE WITH</span>
        </div>

        <div class="auth-social-row" role="group" aria-label="Social sign-in options">
          <button type="button" id="btn-auth-google" data-auth-provider="google" class="pmu-social-icon-btn pmu-social-google" title="Continue with Google" aria-label="Continue with Google">
            <i class="fa-brands fa-google"></i>
          </button>
          <button type="button" id="btn-auth-apple" data-auth-provider="apple" class="pmu-social-icon-btn pmu-social-apple" title="Continue with Apple" aria-label="Continue with Apple">
            <i class="fa-brands fa-apple"></i>
          </button>
          <button type="button" id="btn-auth-facebook" data-auth-provider="facebook" class="pmu-social-icon-btn pmu-social-facebook" title="Continue with Facebook" aria-label="Continue with Facebook">
            <i class="fa-brands fa-facebook-f"></i>
          </button>
        </div>

        <!-- 9. Registration -->
        <p class="text-center text-muted small mb-0">
          New to VELOURA Studio? <a href="register.html" class="text-gold fw-semibold">Create Client Account</a>
        </p>
      </form>
    </div>
  </main>


  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/language.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
</body>
</html>
